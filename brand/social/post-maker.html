<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IEM Post Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;700;800&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#08070d; --surface:#100e19; --raised:#191526; --line:rgba(168,85,247,.22); --ink:#f3f0fc; --soft:#b6b0cd; --violet:#7c3aed; --purple:#a855f7; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 Manrope, system-ui, sans-serif; }
  .app { display:grid; grid-template-columns:360px 1fr; min-height:100vh; }
  aside { background:var(--surface); border-right:1px solid var(--line); padding:24px; overflow:auto; max-height:100vh; position:sticky; top:0; }
  h1 { font:800 22px 'Bricolage Grotesque', sans-serif; margin:0 0 4px; }
  .sub { color:var(--soft); font-size:13px; margin:0 0 20px; }
  label { display:block; font-size:12px; color:var(--soft); margin:14px 0 6px; text-transform:uppercase; letter-spacing:.08em; }
  input, textarea, select { width:100%; background:var(--raised); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; }
  textarea { resize:vertical; min-height:96px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tabs { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
  .tabs button { background:var(--raised); color:var(--soft); border:1px solid var(--line); border-radius:10px; padding:10px 8px; font:700 13px Manrope; cursor:pointer; }
  .tabs button[aria-pressed=true] { background:var(--violet); color:#fff; border-color:var(--violet); }
  .dl { margin-top:22px; width:100%; background:linear-gradient(135deg,var(--violet),var(--purple)); color:#fff; border:0; border-radius:999px; padding:14px; font:800 15px Manrope; cursor:pointer; }
  main { display:grid; place-items:center; padding:32px; }
  canvas { width:min(100%, 560px); height:auto; border-radius:14px; box-shadow:0 30px 80px rgba(124,58,237,.25); }
  .hint { color:var(--soft); font-size:12px; margin-top:8px; }
  @media (max-width:860px) { .app { grid-template-columns:1fr; } aside { position:static; max-height:none; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>IEM Post Maker</h1>
    <p class="sub">Level Up TN · fill in, preview, download PNG.</p>

    <label>Template</label>
    <div class="tabs" id="tabs">
      <button data-t="arrival" aria-pressed="true">New arrival · 4:5</button>
      <button data-t="promo" aria-pressed="false">Price drop · 4:5</button>
      <button data-t="specs" aria-pressed="false">Spec sheet · 4:5</button>
      <button data-t="story" aria-pressed="false">Story · 9:16</button>
    </div>

    <label>Product photo (transparent PNG works best)</label>
    <input type="file" id="photo" accept="image/*" />

    <div class="row">
      <div><label>Brand</label><input id="brand" value="Moondrop" /></div>
      <div><label>Badge</label><input id="badge" value="New arrival" /></div>
    </div>
    <label>Model name</label><input id="name" value="Blessing 3" />
    <label>Tagline</label><input id="tagline" value="Reference tuning, hybrid soul." />
    <div class="row">
      <div><label>Price</label><input id="price" value="1 290 TND" /></div>
      <div><label>Old price</label><input id="old" value="1 490 TND" /></div>
    </div>
    <label>Specs (one per line: Label: Value)</label>
    <textarea id="specs">Drivers: 2DD + 4BA
Impedance: 14.5 Ω
Sensitivity: 120 dB/Vrms
Cable: 0.78 2-pin</textarea>
    <div class="row">
      <div><label>Call to action</label><input id="cta" value="Order now" /></div>
      <div><label>Website / handle</label><input id="site" value="levelup.tn" /></div>
    </div>

    <button class="dl" id="download">Download PNG</button>
    <p class="hint">Exports at full resolution (1080×1350 or 1080×1920).</p>
  </aside>
  <main><canvas id="c"></canvas></main>
</div>

const C = { bg:'#08070d', ink:'#f3f0fc', soft:'#b6b0cd', faint:'#8d87a8', violet:'#7c3aed', purple:'#a855f7', raised:'#191526' };
const DISPLAY = "'Bricolage Grotesque', sans-serif", BODY = 'Manrope, sans-serif', MONO = "'Geist Mono', monospace";
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const logo = new Image(); logo.src = LOGO_SRC;
let photo = null, template = 'arrival';
const val = (id) => document.getElementById(id).value.trim();

function fit(img, x, y, w, h) {
  const s = Math.min(w / img.width, h / img.height), dw = img.width * s, dh = img.height * s;
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}
function glow(x, y, r, a = .45) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(124,58,237,${a})`); g.addColorStop(1, 'rgba(124,58,237,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, canvas.width, canvas.height);
}
function text(str, x, y, font, color, align = 'left', tracking = 0) {
  ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align; ctx.letterSpacing = tracking + 'px'; ctx.fillText(str, x, y); ctx.letterSpacing = '0px';
}
// Shrinks the font until the string fits maxW, then returns the size used.
function fitText(str, x, y, weight, family, size, maxW, color, align = 'left') {
  ctx.font = `${weight} ${size}px ${family}`;
  while (ctx.measureText(str).width > maxW && size > 24) ctx.font = `${weight} ${--size}px ${family}`;
  text(str, x, y, ctx.font, color, align); return size;
}
function pill(str, x, y, { fill = C.violet, color = '#fff', size = 26, align = 'left' } = {}) {
  ctx.font = `800 ${size}px ${BODY}`; ctx.letterSpacing = '3px';
  const w = ctx.measureText(str.toUpperCase()).width + size * 1.6, h = size * 2;
  const left = align === 'right' ? x - w : align === 'center' ? x - w / 2 : x;
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(left, y, w, h, h / 2); ctx.fill();
  text(str.toUpperCase(), left + w / 2, y + h * .66, ctx.font, color, 'center', 3); return w;
}
function placeholder(x, y, w, h) {
  ctx.save(); ctx.setLineDash([14, 12]); ctx.strokeStyle = 'rgba(168,85,247,.45)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 36); ctx.stroke(); ctx.restore();
  text('Upload a product photo', x + w / 2, y + h / 2 + 12, `600 34px ${BODY}`, C.faint, 'center');
}
function product(x, y, w, h) {
  glow(x + w / 2, y + h / 2, Math.max(w, h) * .55, .55);
  if (!photo) return placeholder(x, y, w, h);
  ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.55)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 30; fit(photo, x, y, w, h); ctx.restore();
}
function base(w, h) {
  canvas.width = w; canvas.height = h;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, w, h);
  glow(w * .85, -h * .05, w * .75, .35);
  // Fine grid for texture
  ctx.strokeStyle = 'rgba(168,85,247,.05)'; ctx.lineWidth = 1;
  for (let i = 0; i < w; i += 60) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke(); }
  for (let i = 0; i < h; i += 60) { ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke(); }
  if (logo.complete) { const lw = 380; ctx.drawImage(logo, 72, 72, lw, lw * logo.height / logo.width); }
}
function footer(w, h, y) {
  ctx.fillStyle = 'rgba(168,85,247,.25)'; ctx.fillRect(72, y, w - 144, 2);
  text(val('site'), 72, y + 62, `500 28px ${MONO}`, C.soft, 'left', 1);
  pill(val('cta'), w - 72, y + 22, { align: 'right', size: 24 });
}
function specList() {
  return val('specs').split('\n').map((l) => l.split(':')).filter((p) => p.length > 1).map(([k, ...v]) => [k.trim(), v.join(':').trim()]).slice(0, 4);
}

const templates = {
  arrival() {
    const w = 1080, h = 1350; base(w, h);
    pill(val('badge'), w - 72, 78, { align: 'right' });
    product(110, 190, 860, 640);
    text(val('brand').toUpperCase(), 72, 930, `500 30px ${MONO}`, C.purple, 'left', 6);
    fitText(val('name'), 72, 1030, 800, DISPLAY, 104, 600, C.ink);
    text(val('tagline'), 72, 1094, `500 36px ${BODY}`, C.soft);
    footer(w, h, 1190);
    fitText(val('price'), w - 72, 1030, 800, DISPLAY, 60, 340, C.purple, 'right');
  },
  promo() {
    const w = 1080, h = 1350; base(w, h);
    const p = parseFloat(val('price').replace(/[^\d.]/g, '')), o = parseFloat(val('old').replace(/[^\d.]/g, ''));
    const off = o > p ? `-${Math.round((1 - p / o) * 100)}%` : val('badge');
    product(140, 170, 800, 600);
    // Discount burst
    ctx.save(); ctx.translate(w - 200, 270); ctx.rotate(-.12);
    ctx.fillStyle = C.violet; ctx.beginPath(); ctx.arc(0, 0, 120, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.setLineDash([8, 8]); ctx.beginPath(); ctx.arc(0, 0, 104, 0, Math.PI * 2); ctx.stroke();
    fitText(off, 0, 26, 800, DISPLAY, 76, 200, '#fff', 'center'); ctx.restore();
    text('PRICE DROP', 72, 860, `500 30px ${MONO}`, C.purple, 'left', 6);
    fitText(`${val('brand')} ${val('name')}`, 72, 950, 800, DISPLAY, 88, w - 144, C.ink);
    const size = fitText(val('price'), 72, 1090, 800, DISPLAY, 120, 600, C.ink);
    ctx.font = `800 ${size}px ${DISPLAY}`; const px = 72 + ctx.measureText(val('price')).width + 32;
    if (val('old')) {
      text(val('old'), px, 1080, `600 44px ${BODY}`, C.faint);
      ctx.font = `600 44px ${BODY}`; const ow = ctx.measureText(val('old')).width;
      ctx.strokeStyle = C.purple; ctx.lineWidth = 4; ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(px - 4, 1066); ctx.lineTo(px + ow + 4, 1066); ctx.stroke();
    }
    footer(w, h, 1190);
  },
  specs() {
    const w = 1080, h = 1350; base(w, h);
    pill('Spec sheet', w - 72, 78, { align: 'right', fill: C.raised, color: C.ink });
    product(160, 180, 760, 480);
    text(val('brand').toUpperCase(), 72, 740, `500 30px ${MONO}`, C.purple, 'left', 6);
    fitText(val('name'), 72, 830, 800, DISPLAY, 92, 640, C.ink);
    fitText(val('price'), w - 72, 830, 800, DISPLAY, 56, 340, C.purple, 'right');
    const s = specList(), cw = (w - 144 - 24) / 2, ch = 138;
    s.forEach(([k, v], i) => {
      const x = 72 + (i % 2) * (cw + 24), y = 880 + Math.floor(i / 2) * (ch + 24);
      ctx.fillStyle = 'rgba(25,21,38,.9)'; ctx.strokeStyle = 'rgba(168,85,247,.22)'; ctx.lineWidth = 2; ctx.setLineDash([]);
      ctx.beginPath(); ctx.roundRect(x, y, cw, ch, 24); ctx.fill(); ctx.stroke();
      text(k.toUpperCase(), x + 32, y + 50, `500 22px ${MONO}`, C.faint, 'left', 3);
      fitText(v, x + 32, y + 108, 700, DISPLAY, 46, cw - 64, C.ink);
    });
    // Specs grid ends near 1180; footer sits just under it.
    footer(w, h, 1218);
  },
  story() {
    const w = 1080, h = 1920; base(w, h);
    pill(val('badge'), w - 72, 78, { align: 'right' });
    product(80, 260, 920, 860);
    text(val('brand').toUpperCase(), w / 2, 1240, `500 34px ${MONO}`, C.purple, 'center', 8);
    fitText(val('name'), w / 2, 1360, 800, DISPLAY, 128, w - 144, C.ink, 'center');
    text(val('tagline'), w / 2, 1436, `500 40px ${BODY}`, C.soft, 'center');
    fitText(val('price'), w / 2, 1570, 800, DISPLAY, 96, w - 144, C.ink, 'center');
    if (val('old')) { text(val('old'), w / 2, 1630, `600 38px ${BODY}`, C.faint, 'center'); const ow = ctx.measureText(val('old')).width; ctx.strokeStyle = C.purple; ctx.lineWidth = 4; ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(w / 2 - ow / 2 - 4, 1617); ctx.lineTo(w / 2 + ow / 2 + 4, 1617); ctx.stroke(); }
    pill(val('cta'), w / 2, 1700, { align: 'center', size: 30 });
    text(val('site'), w / 2, 1850, `500 30px ${MONO}`, C.soft, 'center', 1);
  },
};

const draw = () => templates[template]();
document.querySelectorAll('input:not([type=file]), textarea').forEach((el) => el.addEventListener('input', draw));
document.getElementById('tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  template = b.dataset.t;
  document.querySelectorAll('#tabs button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  draw();
});
document.getElementById('photo').addEventListener('change', (e) => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image(); img.onload = () => { photo = img; draw(); }; img.src = URL.createObjectURL(f);
});
document.getElementById('download').addEventListener('click', () => {
  const a = document.createElement('a');
  a.download = `levelup-${template}-${val('name').toLowerCase().replace(/[^a-z0-9]+/g, '-')}.png`;
  a.href = canvas.toDataURL('image/png'); a.click();
});
logo.onload = draw;
document.fonts.load(`800 40px ${DISPLAY}`).then(() => Promise.all([document.fonts.load(`500 20px ${BODY}`), document.fonts.load(`500 20px ${MONO}`)])).finally(draw);
